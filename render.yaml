services:
  - type: web
    name: comicverse-api
    env: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python ComicVerse/manage.py collectstatic --noinput
    preDeployCommand: |
      python ComicVerse/manage.py migrate
    startCommand: |
      gunicorn ComicVerse.wsgi --chdir ComicVerse --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "comicverse-api.onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://comicverse-api.onrender.com,https://localhost:8000,http://localhost:8000"
      - key: WEB_CONCURRENCY
        value: "4"
